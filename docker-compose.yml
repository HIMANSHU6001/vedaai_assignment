services:
  api:
    image: himanshu6001/vedaai-api
    container_name: vedaai-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DO_BASE_URL=${DO_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - vedaai-network

  worker:
    image: himanshu6001/vedaai-api
    container_name: vedaai-worker
    command: [ "node", "dist/worker/worker.js" ]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DO_BASE_URL=${DO_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks:
      - vedaai-network

  frontend:
    image: himanshu6001/vedaai-frontend
    container_name: vedaai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.himanshu6001.dev
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - vedaai-network

  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - vedaai-network

volumes:
  redis_data:

networks:
  vedaai-network:
    driver: bridge
